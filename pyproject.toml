[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "personal-wellness-ai-assistant"
version = "0.1.0"
description = "Local-first Streamlit wellness planner using Azure OpenAI and optional Azure Document Intelligence."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "openai>=1.68",
  "pandas>=2.2",
  "python-dotenv>=1.0",
  "pyyaml>=6.0",
  "requests>=2.32",
  "streamlit>=1.40",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
include = ["assistant.py"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
